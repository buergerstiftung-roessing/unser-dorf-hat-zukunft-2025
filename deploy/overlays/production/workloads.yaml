# udhz: the site is built by CI and published as the branch `production-dist`
# of buergerstiftung-roessing/unser-dorf-hat-zukunft-2025; the init container clones that branch at pod start, the main
# container is a public runtime image and never changes. The annotation
# `levinkeller.de/dist-commit` is rewritten by the deploy job on every publish,
# which is what makes the pod restart and fetch the new output. A pod that
# restarts on its own uses whatever `github-app-token` holds at that moment
# (refreshed every 45 min by cluster/github-app-tokens); the token is only
# needed for private repos and only at start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udhz
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: udhz
  template:
    metadata:
      labels:
        app: udhz
      annotations:
        levinkeller.de/dist-commit: "0000000000000000000000000000000000000000"
    spec:
      enableServiceLinks: false
      initContainers:
      - name: fetch-dist
        image: alpine/git:2.47.2
        env:
        - name: REPO
          value: "buergerstiftung-roessing/unser-dorf-hat-zukunft-2025"
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: github-app-token
              key: token
              optional: true
        command: ["sh", "-ec"]
        args:
          - |
            if [ -n "${TOKEN:-}" ]; then U="https://x-access-token:${TOKEN}@github.com/${REPO}"; else U="https://github.com/${REPO}"; fi
            git clone --quiet --depth 1 --branch production-dist "$U" /site
            rm -rf /site/.git
            echo "dist $(cat /site/.dist-commit 2>/dev/null || echo '?')"
        volumeMounts:
        - name: site
          mountPath: /site
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
      containers:
      - name: udhz
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        readinessProbe:
          tcpSocket: { port: 80 }
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: site
        emptyDir: {}
      - name: nginx-conf
        configMap:
          name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: udhz
spec:
  selector:
    app: udhz
  ports:
  - name: p80
    port: 80
    targetPort: 80
---
# The build Coolify served answered unknown paths with index.html and 200
# (measured before the cutover); this keeps exactly that behaviour.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
