# Production overlay of this site. Argo CD (Application `udhz` in
# levino/server-config) reads THIS directory from the branch `production`,
# which the deploy job writes after every build: main's tree plus the pinned
# `levinkeller.de/dist-commit` annotation in workloads.yaml. Humans never push
# to `production` or `production-dist`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: udhz
resources:
  - workloads.yaml
  - ingress.yaml
