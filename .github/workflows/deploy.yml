name: Deploy

# Push to main -> build the site -> publish the built output to the branch
# `production-dist` -> pin deploy/overlays/production to that commit -> publish
# "main's tree + pin" to the branch `production`. Argo CD on the cluster tracks
# `production`; the pod's init container clones `production-dist` at start.
#
# No container image, no registry: the cluster may only use the GitHub App,
# and GHCR does not let an App installation read private packages. Git it can.
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish the built output as the orphan branch `production-dist`
        id: dist
        working-directory: build
        run: |
          echo "${{ github.sha }}" > .dist-commit
          git init -q -b production-dist
          git config user.name  "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "dist for ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/production-dist
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pin the overlay to that dist commit and publish it to `production`
        run: |
          sed -i "s|levinkeller.de/dist-commit: \".*\"|levinkeller.de/dist-commit: \"${{ steps.dist.outputs.sha }}\"|" deploy/overlays/production/workloads.yaml
          grep -q "${{ steps.dist.outputs.sha }}" deploy/overlays/production/workloads.yaml
          git config user.name  "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deploy/overlays/production/workloads.yaml
          git commit -q -m "chore(deploy): roll to dist ${{ steps.dist.outputs.sha }} (source ${{ github.sha }})"
          git push --force origin HEAD:refs/heads/production
